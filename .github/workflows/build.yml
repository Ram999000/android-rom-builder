name: Build ROM

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (e.g. matrixx_sky)'
        required: true
      variant:
        description: 'Build variant (user, userdebug, eng)'
        default: 'userdebug'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential openjdk-11-jdk git-core gnupg flex bison gperf curl git git-lfs repo
      
      - name: Setup Matrixx Source and Local Manifest
        run: |
          # Git configuration to bypass auth errors
          git config --global user.name "Ram999000"
          git config --global user.email "ram@example.com"
          git config --global credential.helper ""
          
          # Initializing Project Matrixx 15 Source using system repo
          repo init -u https://github.com -b 15.0 --depth=1
          
          # Injecting your custom device tree local manifest
          mkdir -p .repo/local_manifests
          curl -L -o .repo/local_manifests/matrixx.xml https://githubusercontent.com
          
          # Safe sync with network optimization flags
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build ROM
        run: |
          chmod +x build.sh
          ./build.sh "${{ github.event.inputs.target }}" "${{ github.event.inputs.variant }}"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-${{ github.event.inputs.target }}
          path: 'out/target/product/**/*.zip'
          retention-days: 7

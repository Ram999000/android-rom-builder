name: Build ROM

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (e.g. matrixx_sky)'
        required: true
      variant:
        description: 'Build variant (user, userdebug, eng)'
        default: 'userdebug'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential openjdk-11-jdk git-core gnupg flex bison gperf curl git git-lfs repo
      
      - name: Setup Matrixx Source and Local Manifest
        run: |
          # गिटहब टोकन एरर को लोकल लेवल पर रोकने का परमानेंट इलाज
          git config --global --unset-all http.https://github.com || true
          
          git config --global user.name "Ram999000"
          git config --global user.email "ram@example.com"
          
          # 1. बिना किसी ऑथेंटिकेशन टोकन के सिंक करने के लिए कस्टमाइज्ड यूआरएल
          repo init -u https://github.com/ProjectMatrixx/android -b 15.0 --depth=1 --groups=default,-mips,-x86,-darwin
          
          # 2. आपका लोकल मैनिफ़ेस्ट डाउनलोड करना
          mkdir -p .repo/local_manifests
          curl -L -o .repo/local_manifests/matrixx.xml https://githubusercontent.com
          
          # 3. फ़ोर्स सिंक जो गिटहब एक्स्ट्रा हेडर को बायपास करेगा
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build ROM
        run: |
          chmod +x build.sh
          ./build.sh "${{ github.event.inputs.target }}" "${{ github.event.inputs.variant }}"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-${{ github.event.inputs.target }}
          path: 'out/target/product/**/*.zip'
          retention-days: 7
